#
# tikker + optional Caddy (automatic TLS). Guide: docs/deploy-server.md.
#
#   create .env next to this file (or export the variables), then:
#   docker compose -f deploy/docker/compose.yaml up -d                  # HTTP on ${TIKKER_BIND}:${TIKKER_PORT}
#   docker compose -f deploy/docker/compose.yaml --profile tls up -d    # + Caddy on 80/443
#
# Variables (shell or .env next to this file):
#   TIKKER_IMAGE           image (default ghcr.io/m4drak/tikker:latest; or build: `make docker`, tag tikker:<version>)
#   TIKKER_ADMIN_PASSWORD  admin created on the first start (min. 12 characters; ignored when the database has users)
#   TIKKER_BASE_URL        public URL, e.g. https://sms.example.com (needed behind the proxy)
#   TIKKER_DOMAIN          profile tls: domain served by Caddy (DNS must point to this host)
#   TIKKER_BIND / TIKKER_PORT  where the HTTP port is published on the host (default 127.0.0.1:8080);
#                          use 0.0.0.0 only for a trusted LAN without the tls profile
#   TIKKER_ALLOWED_HTTP_HOSTS  only if a router is reached over http:// (e.g. a lab); the default is https only
#   Optional e-mail <-> SMS gateway (docs/email-gateway.md, off by default): set TIKKER_MAIL_GATEWAY_* /
#   TIKKER_MAIL_NOTIFY_* below and uncomment the SMTP port. The SMTP server needs a certificate
#   (TIKKER_MAIL_GATEWAY_TLS_CERT_FILE/KEY_FILE, e.g. mounted under /data/tls) unless it listens on loopback.

name: tikker

services:
  tikker:
    image: ${TIKKER_IMAGE:-ghcr.io/m4drak/tikker:latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TIKKER_BASE_URL: ${TIKKER_BASE_URL:-}
      TIKKER_ADMIN_PASSWORD: ${TIKKER_ADMIN_PASSWORD:-}
      TIKKER_ALLOWED_HTTP_HOSTS: ${TIKKER_ALLOWED_HTTP_HOSTS:-}
      # Only the Caddy proxy's own address is trusted for X-Forwarded-For
      # (F-03). Not the whole subnet, so a reverse proxy is the only party
      # that can spoof the client IP that keys the login rate limit and audit.
      TIKKER_TRUSTED_PROXIES: ${TIKKER_TRUSTED_PROXIES:-172.28.0.10}
      TIKKER_DEFAULT_REGION: ${TIKKER_DEFAULT_REGION:-PL}
      # E-mail -> SMS (SMTP submission with API-token AUTH); off unless set to true.
      TIKKER_MAIL_GATEWAY_ENABLED: ${TIKKER_MAIL_GATEWAY_ENABLED:-false}
      TIKKER_MAIL_GATEWAY_DOMAIN: ${TIKKER_MAIL_GATEWAY_DOMAIN:-}
      TIKKER_MAIL_GATEWAY_TLS_CERT_FILE: ${TIKKER_MAIL_GATEWAY_TLS_CERT_FILE:-}
      TIKKER_MAIL_GATEWAY_TLS_KEY_FILE: ${TIKKER_MAIL_GATEWAY_TLS_KEY_FILE:-}
    volumes:
      - tikker-data:/data
    ports:
      - "${TIKKER_BIND:-127.0.0.1}:${TIKKER_PORT:-8080}:8080"
      # Optional SMTP gateway (TIKKER_MAIL_GATEWAY_ENABLED=true); publish it only to a trusted network.
      # - "${TIKKER_SMTP_BIND:-127.0.0.1}:${TIKKER_SMTP_PORT:-2525}:2525"
    healthcheck:
      # The scratch image has no shell: exec form only (the same command as the image HEALTHCHECK).
      test: ["CMD", "/tikker", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 128m
    networks:
      default: {}

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      tikker:
        condition: service_healthy
    environment:
      TIKKER_DOMAIN: ${TIKKER_DOMAIN:-localhost}
    # A fixed address so tikker can trust exactly this proxy (F-03); keep it
    # in sync with the default TIKKER_TRUSTED_PROXIES above.
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  tikker-data:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
