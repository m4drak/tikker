{{define "title"}}{{t "login.title"}}{{end}}
{{define "content" -}}
<article class="auth-card">
  <header><h1>{{t "login.heading"}}</h1></header>
  {{- if .Data.Error}}
  <p id="login-error" class="notice" role="alert">{{.Data.Error}}</p>
  {{- end}}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label for="username">{{t "login.username"}}</label>
    <input id="username" name="username" type="text" value="{{.Data.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required{{if .Data.Error}} aria-invalid="true" aria-describedby="login-error"{{end}}>
    <label for="password">{{t "login.password"}}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required{{if .Data.Error}} aria-invalid="true" aria-describedby="login-error"{{end}}>
    <button type="submit">{{t "login.submit"}}</button>
  </form>
</article>
{{- end}}
