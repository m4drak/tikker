        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Dodaj webhook
      description: |
        Każde zdarzenie jest wysyłane jako `POST` z nagłówkami `X-Tikker-Event`, `X-Tikker-Delivery`
        i `X-Tikker-Signature: sha256=<HMAC-SHA256(sekret, treść)>`. Treść to obiekt JSON z polami
        `id` (identyfikator dostarczenia, taki sam przy ponowieniach), `event`, `occurred_at` i `message`.
        Ponieważ `id` jest w podpisanej treści, odbiorca musi sprawdzić podpis **i** to, że nagłówek
        `X-Tikker-Delivery` jest równy `id` z treści, a następnie deduplikować po `id`
        (w Go: `webhook.VerifyRequest`). Odpowiedź `2xx` kończy dostarczenie,
        `5xx`, `408`, `429`, timeout i błąd połączenia są ponawiane z wykładniczym opóźnieniem,
        pozostałe `4xx` oraz przekierowania kończą je błędem.

        Adresy wewnętrzne (loopback, prywatne, link-local, w tym `169.254.169.254`, CGNAT) są odrzucane
        przy wysyłce po rozwiązaniu nazwy (`422 forbidden_destination` dla adresu IP w URL); wyjątkiem są
        hosty z `TIKKER_ALLOWED_HTTP_HOSTS`. Proxy ze zmiennych środowiskowych nie jest używane.
        Zmiana `url` lub wyłączenie webhooka anuluje jego niedostarczone powiadomienia.

        Sekret jest zwracany tylko w tej odpowiedzi. Pominięty `secret` oznacza, że serwer go wygeneruje.
        URL `http://` jest dozwolony tylko dla adresów z `TIKKER_ALLOWED_HTTP_HOSTS`.
      security:
        - bearerAuth: ['admin']
      x-required-scopes: ['admin']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            examples:
              both:
                summary: Oba zdarzenia, sekret wygenerowany przez serwer
                value:
                  name: 'CRM'
                  url: 'https://crm.example.com/hooks/tikker'
                  events: [incoming_sms, message_status]
      responses:
        '201':
          description: 'Utworzono. Odpowiedź zawiera sekret i ma nagłówek Cache-Control: no-store.'
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

