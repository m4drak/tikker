                  summary: Gotowa
                  value:
                    status: ready
                    checks:
                      database: ok
                      secret_key: ok
                      dispatcher: ok
        '503':
          description: Niegotowa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              examples:
                notReady:
                  summary: Baza niedostępna
                  value:
                    status: not_ready
                    checks:
                      database: fail
                      secret_key: ok
                      dispatcher: ok

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'tkr_<prefix>_<secret>'
      description: |
        Token API w formacie `tkr_<prefix>_<secret>`, gdzie `prefix` i `secret` składają się ze znaków
        `[A-Za-z0-9]` (bez `_`). `prefix` jest jawny i identyfikuje token (widoczny w UI i na liście),
        `secret` jest znany tylko klientowi (serwer przechowuje SHA-256). Długości ustala implementacja (T11).
        Zakresy: `sms:read`, `sms:send`, `admin` (opis w sekcji „Autoryzacja i zakresy”).

  parameters:
    MessageId:
      name: id
      in: path
      required: true
      description: Identyfikator wiadomości (ULID).
      schema:
        $ref: '#/components/schemas/Ulid'
    ChannelId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DeviceId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WebhookId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TokenId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Cursor:
      name: cursor
      in: query
      description: Nieprzezroczysty kursor z `next_cursor` poprzedniej strony.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Maksymalna liczba elementów na stronie.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Klucz idempotencji (draft-ietf-httpapi-idempotency-key-header), unikalny w obrębie tokenu przez 24 h.
        Zalecany UUID v4 lub ULID. Semantyka: patrz sekcja „Idempotencja” w opisie API.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
      example: '8e03978e-40d5-43e8-bc93-6894a57f9324'

  headers:
    Location:
      description: Ścieżka utworzonego zasobu.
      schema:
        type: string
        format: uri-reference
      example: '/api/v1/messages/01M89304ZQ61F6CVNX486V10VC'
    IdempotentReplayed:
      description: '`true`, jeśli odpowiedź jest powtórzeniem wcześniejszego żądania z tym samym `Idempotency-Key`.'
      schema:
        type: string
        enum: ['true']
    RateLimitLimit:
      description: Limit żądań tokenu w bieżącym oknie.
      schema:
        type: integer
        minimum: 0
      example: 120
    RateLimitRemaining:
      description: Liczba żądań pozostałych w bieżącym oknie.
      schema:
        type: integer
        minimum: 0
      example: 117
    RateLimitReset:
      description: Liczba sekund do odnowienia limitu.
      schema:
        type: integer
        minimum: 0
      example: 42
    RetryAfter:
      description: Liczba sekund, po której można ponowić żądanie.
      schema:
        type: integer
        minimum: 0
      example: 42
    Allow:
      description: Metody dozwolone dla ścieżki (RFC 9110 §10.2.1).
      schema:
        type: string
      example: 'GET, POST'
    WWWAuthenticate:
      description: Wyzwanie uwierzytelnienia (RFC 6750).
      schema:
        type: string
      example: 'Bearer realm="tikker", error="invalid_token"'

  responses:
    BadRequest:
      description: Niepoprawne żądanie (składnia JSON, typ pola, nieznane pole, niepoprawny parametr lub nagłówek).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformed:
              summary: Niepoprawny JSON
              value:
                type: 'urn:tikker:problem:malformed-request'
                title: Malformed request
                status: 400
                detail: 'Request body is not valid JSON: unexpected end of input at offset 57.'
                instance: '/api/v1/messages'
            badParam:
              summary: Zły parametr zapytania
              value:
                type: 'urn:tikker:problem:malformed-request'
                title: Malformed request
                status: 400
                detail: 'Invalid query parameters.'
                instance: '/api/v1/messages'
                errors:
                  - field: 'limit'
                    code: out_of_range
                    detail: 'Must be between 1 and 200.'
    Unauthorized:
      description: Brak lub niepoprawny token.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidToken:
              summary: Niepoprawny token
              value:
                type: 'urn:tikker:problem:unauthorized'
                title: Unauthorized
                status: 401
                detail: 'Missing, invalid, expired or revoked API token.'
    Forbidden:
      description: Token nie ma wymaganego zakresu.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            insufficientScope:
              summary: Brak zakresu
              value:
                type: 'urn:tikker:problem:forbidden'
                title: Forbidden
                status: 403
                detail: 'Token lacks required scope "sms:send".'
    NotFound:
      description: |
        Zasób nie istnieje. Ta sama odpowiedź (bez uwierzytelnienia i bez nagłówków `RateLimit-*`)
        dotyczy nieznanej ścieżki pod `/api/v1`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              summary: Nie znaleziono
              value:
                type: 'urn:tikker:problem:not-found'
                title: Not Found
                status: 404
                detail: 'Resource not found.'
                instance: '/api/v1/messages/01M89318NRW5XR0Q6R54W9CZZT'
    Conflict:
      description: Konflikt unikalności lub stanu zasobu.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            duplicate:
              summary: Nazwa zajęta
              value:
                type: 'urn:tikker:problem:conflict'
                title: Conflict
                status: 409
                detail: 'A resource with this name already exists.'
            busy:
              summary: Zasób ma aktywne wiadomości
              value:
                type: 'urn:tikker:problem:conflict'
                title: Conflict
                status: 409
                detail: 'Channel has 4 messages in status "queued" or "sending".'
    IdempotencyConflict:
      description: Żądanie z tym samym `Idempotency-Key` jest w trakcie przetwarzania.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            inUse:
              summary: Klucz w użyciu
              value:
                type: 'urn:tikker:problem:idempotency-key-in-use'
                title: Idempotency key in use
                status: 409
                detail: 'A request with this Idempotency-Key is still being processed; retry later.'
    PayloadTooLarge:
      description: Ciało żądania przekracza limit rozmiaru serwera (domyślnie 2 MiB).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooLarge:
              summary: Za duże ciało żądania
              value:
                type: 'urn:tikker:problem:payload-too-large'
                title: Payload too large
                status: 413
                detail: 'Request body exceeds the limit of 2097152 bytes.'
                instance: '/api/v1/messages'
    BatchTooLarge:
      description: Paczka ma więcej niż 100 wiadomości albo ciało żądania przekracza limit rozmiaru serwera.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooMany:
              summary: 150 wiadomości
              value:
                type: 'urn:tikker:problem:batch-too-large'
                title: Batch too large
                status: 413
                detail: 'Batch contains 150 messages; the maximum is 100.'
                instance: '/api/v1/messages/batch'
            tooLarge:
              summary: Za duże ciało żądania
              value:
                type: 'urn:tikker:problem:payload-too-large'
                title: Payload too large
                status: 413
                detail: 'Request body exceeds the limit of 2097152 bytes.'
                instance: '/api/v1/messages/batch'
    MethodNotAllowed:
      description: |
        Odpowiedź wspólna dla wszystkich ścieżek (opis API, „Odpowiedzi wspólne”): ścieżka istnieje,
        ale nie obsługuje metody żądania. Wysyłana przed uwierzytelnieniem, bez nagłówków `RateLimit-*`.
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            put:
              summary: PUT na kolekcji wiadomości
              value:
                type: 'urn:tikker:problem:method-not-allowed'
                title: Method Not Allowed
                status: 405
                detail: 'Method PUT is not allowed for this resource.'
                instance: '/api/v1/messages'
    UnprocessableContent:
      description: Żądanie poprawne składniowo, ale niepoprawne semantycznie.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Błędy walidacji
              value:
                type: 'urn:tikker:problem:validation'
                title: Request validation failed
                status: 422
                errors:
                  - field: '/fingerprint'
                    code: required
                    detail: 'Required when tls_mode is "fingerprint".'
    MessageUnprocessable:
      description: |
        Wiadomość niepoprawna semantycznie (np. zły numer, za dużo segmentów, nieznany kanał)
        albo ten sam `Idempotency-Key` użyty z innym ciałem żądania.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidNumber:
              summary: Niepoprawny numer
              value:
                type: 'urn:tikker:problem:validation'
                title: Request validation failed
                status: 422
                instance: '/api/v1/messages'
                errors:
                  - field: '/to'
                    code: invalid_phone_number
                    detail: 'Not a valid phone number for region PL.'
            tooManySegments:
              summary: Za dużo segmentów
              value:
                type: 'urn:tikker:problem:validation'
                title: Request validation failed
                status: 422
                instance: '/api/v1/messages'
                errors:
                  - field: '/body'
                    code: too_many_segments
                    detail: 'Body needs 5 UCS-2 segments; channel limit is 3.'
            unsupportedCharacters:
              summary: Znaki spoza GSM-7 na kanale bez UCS-2 i bez transliteracji
              value:
                type: 'urn:tikker:problem:validation'
                title: Request validation failed
                status: 422
                detail: "Character 'ż' is outside the GSM-7 alphabet, and the channel sends GSM-7 only; enable transliterate on the channel or remove such characters."
                instance: '/api/v1/messages'
                errors:
                  - field: '/body'
                    code: unsupported_characters
                    detail: "Character 'ż' is outside the GSM-7 alphabet, and the channel sends GSM-7 only; enable transliterate on the channel or remove such characters."
            idempotencyMismatch:
              summary: Klucz idempotencji z innym ciałem
              value:
                type: 'urn:tikker:problem:idempotency-key-mismatch'
                title: Idempotency key reused with different payload
                status: 422
                detail: 'Idempotency-Key was already used with a different request body.'
    TooManyRequests:
      description: Przekroczony limit żądań tokenu.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limited:
              summary: Limit wyczerpany
              value:
                type: 'urn:tikker:problem:rate-limited'
                title: Too Many Requests
                status: 429
                detail: 'Rate limit of 120 requests per 60 s exceeded; retry in 42 s.'
    InternalError:
      description: Błąd serwera. Szczegóły tylko w logach (identyfikator w `instance`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              summary: Błąd wewnętrzny
              value:
                type: 'urn:tikker:problem:internal'
                title: Internal Server Error
                status: 500
                instance: 'urn:tikker:request:01M89318NRW5XR0Q6R54W9CZZT'

  schemas:
    Ulid:
      type: string
      description: ULID (Crockford base32, 26 znaków, sortowalny czasowo).
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: ['01M89304ZQ61F6CVNX486V10VC']
    Id:
      type: string
      description: |
        Nieprzezroczysty identyfikator zasobu. Implementacja referencyjna używa ULID,
        ale klient nie powinien zakładać formatu (poza wiadomościami, gdzie ULID jest gwarantowany).
      minLength: 1
      maxLength: 64
      examples: ['01M892CBQGHA3FGHBEPHY2KDRX']
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 w UTC.
      examples: ['2026-11-25T09:46:40Z']
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
      description: RFC 3339 w UTC albo `null`.
    Tag:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9][a-z0-9_.-]*$'
      examples: ['orange']
    Tags:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
      maxItems: 16
      uniqueItems: true

    Direction:
      type: string
      enum: [out, in]
      description: '`out` – wychodząca, `in` – przychodząca.'
    MessageStatus:
      type: string
      enum: [queued, sending, sent, failed, cancelled, received]
      description: |
        Wychodzące (SPEC §4.2): `queued` → `sending` → `sent` | `failed`; `queued` → `cancelled`;
        `sending` → `queued` przy błędzie przejściowym. `sent` oznacza przyjęcie przez RouterOS (brak raportów doręczenia).
        Wygaśnięcie (`expires_at`) kończy wiadomość stanem `failed` z `last_error` zaczynającym się od `expired`.
        Przychodzące mają zawsze stan `received`.
    Encoding:
      type: string
      enum: [gsm7, ucs2]
      description: 'Kodowanie wyliczone z treści: `gsm7` (160/153 znaków na segment) lub `ucs2` (70/67).'

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [to, body]
      properties:
        to:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Numer odbiorcy. Normalizowany do E.164 z regionem domyślnym (`TIKKER_DEFAULT_REGION`, domyślnie `PL`),
            więc `600100200` i `+48 600 100 200` są równoważne. Numery krótkie i alfanumeryczne tylko przy
            włączonym `allow_short_numbers`. Niepoprawny numer → `422` (`invalid_phone_number`).
          examples: ['+48600100200']
        body:
          type: string
          minLength: 1
          maxLength: 1600
          description: |
            Treść (UTF-8). Rzeczywisty limit wynika z `max_segments` kanału (domyślnie 3 segmenty) i możliwości
            konektora; przekroczenie → `422` (`too_many_segments`), chyba że serwer działa ze strategią
            `truncate` lub `split` (SPEC §4.6). Przy `transliterate` kanału polskie znaki są zamieniane na ASCII
            przed wyliczeniem segmentów. Znaki spoza GSM-7 przy kanale bez UCS-2 (RouterOS) i bez transliteracji
            → `422` (`unsupported_characters`).
        channel_id:
          $ref: '#/components/schemas/Id'
          description: Jawny wybór kanału. Nieznany → `422` (`unknown_channel`), wyłączony → `422` (`channel_disabled`).
        tags:
          $ref: '#/components/schemas/Tags'
          description: Wybór spośród kanałów mających **wszystkie** tagi. Brak takiego kanału → `422` (`no_matching_channel`). Ignorowane, gdy podano `channel_id`.
        client_ref:
          type: string
          maxLength: 128
          description: Dowolny identyfikator klienta, zwracany w obiekcie wiadomości (bez gwarancji unikalności).
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Po tym czasie niewysłana wiadomość przechodzi w `failed` (`expired`). Musi być w przyszłości (`expires_at_in_past`).
    SendBatchRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          description: Od 1 do 100 wiadomości. Przekroczenie 100 → `413`.
          items:
            $ref: '#/components/schemas/SendMessageRequest'
    SendMessageResponse:
      type: object
      description: |
        Wiadomości utworzone z jednego `SendMessageRequest`, w kolejności treści. Zwykle jedna;
        przy strategii `split` (SPEC §4.6, §12 p. 3) kilka niezależnych wiadomości z prefiksami `(i/N) `.
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
    SendBatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Po jednej pozycji na każdą pozycję `messages` żądania, w tej samej kolejności.
          items:
            $ref: '#/components/schemas/SendMessageResponse'

    Message:
      type: object
      description: |
        Wiadomość SMS. Pola wewnętrzne (`lease_until`, `idempotency_key`, `dedup_hash`) nie są publikowane.
      required: [id, direction, channel_id, peer, body, encoding, segments, status, attempts, possible_duplicate, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        direction:
          $ref: '#/components/schemas/Direction'
        channel_id:
          type: [string, 'null']
          description: Kanał. Dla wychodzących `null`, dopóki routing nie przydzieli kanału.
        peer:
          type: string
          description: Rozmówca – odbiorca (`out`) lub nadawca (`in`). E.164; dla `in` może być nadawcą alfanumerycznym.
          examples: ['+48600100200']
        body:
          type: [string, 'null']
          description: Treść; `null` po usunięciu treści przez retencję (SPEC §7, `TIKKER_RETENTION`).
        encoding:
          $ref: '#/components/schemas/Encoding'
        segments:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/MessageStatus'
        attempts:
          type: integer
          minimum: 0
          description: Liczba podjętych prób wysyłki (dla `in` zawsze 0).
        next_attempt_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Najwcześniejszy czas kolejnej próby (stan `queued` po błędzie przejściowym).
        last_error:
          type: [string, 'null']
          maxLength: 1024
          description: Ostatni błąd wysyłki, przeznaczony dla człowieka.
        possible_duplicate:
          type: boolean
          description: |
            `true`, gdy wiadomość mogła zostać wysłana więcej niż raz (np. wygasła dzierżawa lub niejednoznaczny
            błąd po przekazaniu do routera, ADR 0002, gwarancja at-least-once). Dla `in` zawsze `false`.
        client_ref:
          type: [string, 'null']
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: Tagi routingu z żądania (puste dla `in`).
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_by:
          type: [string, 'null']
          pattern: '^(user|token):.+$'
          description: 'Autor: `user:<id>` (panel) lub `token:<id>` (API); `null` dla przychodzących.'
          examples: ['token:01M892MQA05HWZW8AF2ZXZHMH3']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        sent_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Czas przyjęcia przez RouterOS (`sent`).
        received_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Czas odbioru wg routera (tylko `in`).
    MessagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    PageMeta:
      type: object
      description: Wspólna część strony wyników.
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Kursor następnej strony; `null` na ostatniej stronie.

    ChannelState:
      type: string
      enum: [ok, degraded, down, disabled]
      description: |
        `ok` – zdrowy; `degraded` – działa z problemami (np. błąd autoryzacji do routera, słaby sygnał);
        `down` – niedostępny; `disabled` – wyłączony przez administratora (lub urządzenie wyłączone).
    Signal:
      type: [object, 'null']
      description: Parametry radiowe z ostatniego sprawdzenia; brakujące wartości to `null`.
      properties:
        rssi:
          type: [integer, 'null']
          description: dBm.
        rsrp:
          type: [integer, 'null']
          description: dBm.
        rsrq:
          type: [integer, 'null']
          description: dB.
        sinr:
          type: [integer, 'null']
          description: dB.
    Channel:
      type: object
      required: [id, device_id, port, name, tags, rate_per_min, max_segments, transliterate, enabled, state, last_health_at, signal, operator]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        device_id:
          $ref: '#/components/schemas/Id'
        port:
          type: string
          examples: ['lte1']
        name:
          type: string
        tags:
          $ref: '#/components/schemas/Tags'
        rate_per_min:
          type: integer
          minimum: 1
          description: Limit wysyłki kanału (token bucket, SPEC §4.5).
        max_segments:
          type: integer
          minimum: 1
          description: Maksymalna liczba segmentów wiadomości (SPEC §4.6).
        transliterate:
          type: boolean
          description: |
            Zamiana polskich (i innych spoza GSM-7) znaków na ASCII przed wysyłką (SPEC §4.6).
            Zawsze konkretna wartość: podana przy tworzeniu lub wybrana przez serwer (patrz `ChannelCreate`).
        enabled:
          type: boolean
        state:
          $ref: '#/components/schemas/ChannelState'
        state_reason:
          type: [string, 'null']
          description: Krótki opis przyczyny stanu innego niż `ok`.
        last_health_at:
          $ref: '#/components/schemas/NullableTimestamp'
        signal:
          $ref: '#/components/schemas/Signal'
        operator:
          type: [string, 'null']
          examples: ['Orange PL']
        queue_depth:
          type: integer
          minimum: 0
          readOnly: true
          description: Liczba wiadomości `queued` i `sending` przypisanych do kanału.
    ChannelCreate:
      type: object
      additionalProperties: false
      required: [device_id, port]
      properties:
        device_id:
          $ref: '#/components/schemas/Id'
        port:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[A-Za-z0-9._-]+$'
        name:
          type: string
          maxLength: 64
          description: Domyślnie `<nazwa urządzenia>/<port>`.
        tags:
          $ref: '#/components/schemas/Tags'
        rate_per_min:
          type: integer
          minimum: 1
          maximum: 600
          default: 6
        max_segments:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        transliterate:
          type: boolean
          description: |
            Zamiana znaków spoza GSM-7 na ASCII przed wysyłką (SPEC §4.6). Pominięte → serwer wybiera wartość
            na podstawie możliwości konektora urządzenia: `true`, gdy konektor nie obsługuje UCS-2
            (`routeros-rest`), w przeciwnym razie `false`; gdy możliwości nie da się ustalić (np. nie da się
            odszyfrować hasła urządzenia) – `true`. Wybraną wartość zwraca odpowiedź i można ją zmienić przez `PATCH`.
        enabled:
          type: boolean
          default: true
    ChannelUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        tags:
          $ref: '#/components/schemas/Tags'
        rate_per_min:
          type: integer
          minimum: 1
          maximum: 600
        max_segments:
          type: integer
          minimum: 1
          maximum: 10
        transliterate:
          type: boolean
        enabled:
          type: boolean
    ChannelPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Channel'

    TlsMode:
      type: string
      enum: [verify, ca, fingerprint, insecure]
      description: |
        Dotyczy tylko `base_url` z `https://` (SPEC §3.3):
        - `verify` – weryfikacja certyfikatu systemowymi CA (domyślnie);
        - `ca` – weryfikacja własnym CA z `ca_pem`;
        - `fingerprint` – przypięcie odcisku SHA-256 certyfikatu z `fingerprint` (self-signed RouterOS);
        - `insecure` – brak weryfikacji (ostrzeżenie w UI).

        `base_url` z `http://` jest dozwolony wyłącznie dla adresu bramy `veth` w trybie kontenerowym
        (adresy dozwolone konfiguruje serwer; inaczej `422` `insecure_transport_not_allowed`).
        Wtedy `tls_mode` jest ignorowany, a `insecure_transport` w odpowiedzi ma wartość `true`.
    Fingerprint:
      type: string
      description: SHA-256 certyfikatu, 32 bajty hex (wielkość liter i dwukropki dowolne; serwer zwraca postać `AB:CD:…`).
      pattern: '^([0-9A-Fa-f]{2}:?){31}[0-9A-Fa-f]{2}$'
    Device:
      type: object
      description: Urządzenie RouterOS. Hasło nigdy nie jest zwracane.
      required: [id, name, base_url, username, tls_mode, ca_pem, fingerprint, enabled, insecure_transport, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        base_url:
          type: string
          format: uri
          examples: ['https://10.20.0.1']
        username:
          type: string
        tls_mode:
          $ref: '#/components/schemas/TlsMode'
        ca_pem:
          type: [string, 'null']
          description: Certyfikat CA (PEM), gdy `tls_mode` = `ca`.
        fingerprint:
          type: [string, 'null']
          description: Przypięty odcisk, gdy `tls_mode` = `fingerprint`.
        enabled:
          type: boolean
        insecure_transport:
          type: boolean
          readOnly: true
          description: '`true` dla `http://` lub `tls_mode` = `insecure` – UI pokazuje ostrzeżenie.'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    DeviceCreate:
      type: object
      additionalProperties: false
      required: [name, base_url, username, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unikalna (`409`).
        base_url:
          type: string
          format: uri
          pattern: '^https?://'
          maxLength: 255
          description: Adres REST API RouterOS bez `/rest` (np. `https://10.20.0.1:8443`).
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
          format: password
        tls_mode:
          $ref: '#/components/schemas/TlsMode'
          default: verify
        ca_pem:
          type: string
          maxLength: 16384
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        enabled:
          type: boolean
          default: true
      allOf:
        - if:
            required: [tls_mode]
            properties:
              tls_mode:
                const: ca
          then:
            required: [ca_pem]
        - if:
            required: [tls_mode]
            properties:
              tls_mode:
                const: fingerprint
          then:
            required: [fingerprint]
    DeviceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Merge patch; `ca_pem`/`fingerprint` równe `null` usuwają wartość.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
          format: uri
          pattern: '^https?://'
          maxLength: 255
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
          format: password
        tls_mode:
          $ref: '#/components/schemas/TlsMode'
        ca_pem:
          type: [string, 'null']
          maxLength: 16384
        fingerprint:
          oneOf:
            - $ref: '#/components/schemas/Fingerprint'
            - type: 'null'
        enabled:
          type: boolean
    WebhookEvent:
      type: string
      enum: [incoming_sms, message_status]
      description: |
        `incoming_sms` – zapisano nowy SMS przychodzący; `message_status` – wiadomość wychodząca
        przeszła do stanu `sent` lub `failed`.
    Webhook:
      type: object
      required: [id, name, url, events, enabled, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        enabled:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookCreated:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Sekret podpisu HMAC. Widoczny tylko w tej odpowiedzi.
    WebhookCreate:
      type: object
      additionalProperties: false
      required: [name, url, events]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          maxLength: 2048
        secret:
          type: string
          minLength: 16
          maxLength: 256
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEvent'
        enabled:
          type: boolean
          default: true
    WebhookUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          maxLength: 2048
        secret:
          type: string
          minLength: 16
          maxLength: 256
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEvent'
        enabled:
          type: boolean
    WebhookPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Webhook'
    DevicePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Device'
    DeviceTestResult:
      type: object
      required: [ok, checked_at, latency_ms, routeros_version, board_name, tls, lte_ports, error]
      properties:
        ok:
          type: boolean
          description: '`true`, jeśli połączenie, TLS, logowanie i odczyt interfejsów się powiodły.'
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        latency_ms:
          type: [integer, 'null']
          minimum: 0
          description: Czas odpowiedzi pierwszego żądania; `null`, gdy brak połączenia.
        routeros_version:
          type: [string, 'null']
          examples: ['7.16.1 (stable)']
        board_name:
          type: [string, 'null']
        tls:
          type: [object, 'null']
          description: '`null` dla `http://`.'
          required: [mode, verified, peer_fingerprint]
          properties:
            mode:
              $ref: '#/components/schemas/TlsMode'
            verified:
              type: boolean
            peer_fingerprint:
              type: [string, 'null']
              description: Odcisk SHA-256 certyfikatu przedstawionego przez router (do skopiowania jako `fingerprint`).
        lte_ports:
          type: array
          items:
            $ref: '#/components/schemas/LtePort'
        error:
          type: [object, 'null']
          required: [code, detail]
          properties:
            code:
              type: string
              enum: [unreachable, timeout, tls_error, auth_failed, insufficient_policy, unsupported_version, unexpected_response]
            detail:
              type: string
    LtePort:
      type: object
      required: [port, running, operator, registration, signal, channel_id]
      properties:
        port:
          type: string
          examples: ['lte1']
        running:
          type: boolean
        operator:
          type: [string, 'null']
        registration:
          type: [string, 'null']
          description: Stan rejestracji w sieci wg RouterOS (np. `registered`, `searching`, `no-sim`) [WERYFIKACJA T00].
        signal:
          $ref: '#/components/schemas/Signal'
        channel_id:
          type: [string, 'null']
          description: Istniejący kanał dla tego portu albo `null`, jeśli kanału jeszcze nie utworzono.

    Scope:
      type: string
      enum: ['sms:send', 'sms:read', 'admin']
    Token:
      type: object
      description: Token API bez sekretu.
      required: [id, user_id, name, prefix, scopes, expires_at, last_used_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        prefix:
          type: string
          pattern: '^[A-Za-z0-9]+$'
          description: Jawna część tokenu (`tkr_<prefix>_…`).
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          uniqueItems: true
          minItems: 1
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: '`null` – bezterminowy.'
        last_used_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    TokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: '^tkr_[A-Za-z0-9]+_[A-Za-z0-9]+$'
              description: Pełny token. Zwracany **wyłącznie** w odpowiedzi na `POST /tokens`.
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          uniqueItems: true
          minItems: 1
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Pominięte – token bezterminowy. Musi być w przyszłości.
        user_id:
          $ref: '#/components/schemas/Id'
          description: Właściciel; domyślnie użytkownik wykonujący żądanie. Nieznany → `422` (`unknown_user`).
    TokenPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Token'

    Role:
      type: string
      enum: [admin, operator, viewer]
      description: '`viewer` – podgląd; `operator` – wysyłka i anulowanie; `admin` – wszystko.'
    Username:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]+$'
    Password:
      type: string
      writeOnly: true
      format: password
      minLength: 12
      maxLength: 1024
      description: Hasło (min. 12 znaków). Przechowywane jako argon2id, nigdy nie zwracane.
    User:
      type: object
      required: [id, username, role, disabled, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          $ref: '#/components/schemas/Username'
        role:
          $ref: '#/components/schemas/Role'
        disabled:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        role:
          $ref: '#/components/schemas/Role'
        disabled:
          type: boolean
          default: false
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        password:
          $ref: '#/components/schemas/Password'
        role:
          $ref: '#/components/schemas/Role'
        disabled:
          type: boolean
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'

    Problem:
      type: object
      description: Szczegóły problemu wg RFC 9457. Dopuszczalne są dodatkowe pola rozszerzeń.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identyfikator typu problemu (lista w opisie API).
          examples: ['urn:tikker:problem:validation']
        title:
          type: string
          description: Krótki, stały dla danego `type` opis.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Opis konkretnego wystąpienia (dla człowieka; nie parsować).
        instance:
          type: string
          format: uri-reference
          description: Identyfikator wystąpienia (ścieżka żądania lub identyfikator żądania w logach).
        errors:
          type: array
          description: Lista błędów pól (dla `validation`; dla `malformed-request`, gdy błąd dotyczy konkretnego pola lub parametru).
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code, detail]
      properties:
        field:
          type: string
          description: |
            Wskaźnik JSON (RFC 6901) do pola ciała żądania (np. `/messages/3/to`)
            albo nazwa parametru zapytania/nagłówka (np. `limit`, `Idempotency-Key`).
          examples: ['/to']
        code:
          type: string
          description: Kod maszynowy (lista w opisie API). Lista może się rozszerzać – klient musi tolerować nieznane kody.
          examples: ['invalid_phone_number']
        detail:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: Wynik poszczególnych sprawdzeń (bez komunikatów błędów).
          additionalProperties:
            type: string
            enum: [ok, fail]

