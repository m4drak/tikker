    get:
      tags: [health]
      operationId: getReadiness
      summary: Sonda gotowości
      description: |
        Instancja jest gotowa do obsługi ruchu: baza otwarta i zmigrowana, klucz szyfrujący wczytany,
        dispatcher uruchomiony. Stan kanałów **nie** wpływa na gotowość (kolejka przyjmuje wiadomości
        także bez zdrowego kanału). Odpowiedź nie zawiera szczegółów wrażliwych (bez komunikatów błędów, ścieżek, wersji).
      security: []
      x-required-scopes: []
      responses:
        '200':
