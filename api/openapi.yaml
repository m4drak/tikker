#
# Kontrakt REST API tikker (SPEC §5). Źródło prawdy dla handlerów w internal/api.
# Zmiana kontraktu wymaga osobnego PR (PLAN §1.2 p. 3).
openapi: 3.1.0
info:
  title: tikker REST API
  version: 0.2.0
  summary: Bramka SMS oparta o MikroTik RouterOS 7.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
  description: |
    REST API bramki SMS **tikker**. Wszystkie zasoby są dostępne pod `/api/v1`, w formacie JSON
    (`application/json`, UTF-8). Wyjątkiem są sondy `/healthz` i `/readyz` (bez prefiksu i bez autoryzacji).

    ## Autoryzacja i zakresy
    Każde żądanie pod `/api/v1` wymaga nagłówka `Authorization: Bearer tkr_<prefix>_<secret>`.
    Token ma zestaw zakresów (`scopes`):

    | Zakres | Uprawnia do |
    |---|---|
    | `sms:read` | odczyt wiadomości i kanałów |
    | `sms:send` | wysyłka i anulowanie wiadomości |
    | `admin` | zarządzanie urządzeniami, kanałami, tokenami i użytkownikami; **implikuje** `sms:read` i `sms:send` |

    Wymagane zakresy operacji podaje rozszerzenie `x-required-scopes` oraz lista ról w wymaganiu
    `security` (OpenAPI 3.1 dopuszcza ją dla schematów innych niż OAuth2). Operacja wymaga
    **dowolnego** z wymienionych zakresów (`admin` zawsze wystarcza).
    Efektywne uprawnienia tokenu to część wspólna jego zakresów i roli właściciela
    (`viewer` → `sms:read`; `operator` → `sms:read`, `sms:send`; `admin` → wszystko).
    Token wyłączonego użytkownika, wygasły lub unieważniony daje `401`; brak zakresu daje `403`.

    ## Błędy
    Błędy są zwracane jako RFC 9457 `application/problem+json` (schemat `Problem`).
    Pole `type` przyjmuje jedną z wartości:

    | `type` | Status | Znaczenie |
    |---|---|---|
    | `urn:tikker:problem:malformed-request` | 400 | niepoprawny JSON, zły typ pola, nieznany parametr |
    | `urn:tikker:problem:unauthorized` | 401 | brak, zły, wygasły lub unieważniony token |
    | `urn:tikker:problem:forbidden` | 403 | token nie ma wymaganego zakresu |
    | `urn:tikker:problem:not-found` | 404 | zasób lub ścieżka nie istnieje |
    | `urn:tikker:problem:method-not-allowed` | 405 | metoda niedozwolona dla ścieżki (nagłówek `Allow`) |
    | `urn:tikker:problem:conflict` | 409 | konflikt unikalności lub stanu zasobu (np. anulowanie nie-`queued`) |
    | `urn:tikker:problem:idempotency-key-in-use` | 409 | żądanie z tym `Idempotency-Key` jest właśnie przetwarzane |
    | `urn:tikker:problem:payload-too-large` | 413 | ciało żądania przekracza limit rozmiaru (domyślnie 2 MiB) |
    | `urn:tikker:problem:batch-too-large` | 413 | więcej niż 100 wiadomości w paczce |
    | `urn:tikker:problem:validation` | 422 | błędy semantyczne; szczegóły w `errors[]` |
    | `urn:tikker:problem:idempotency-key-mismatch` | 422 | ten sam `Idempotency-Key` z innym ciałem żądania |
    | `urn:tikker:problem:rate-limited` | 429 | przekroczony limit żądań tokenu |
    | `urn:tikker:problem:internal` | 500 | błąd serwera (bez szczegółów wewnętrznych) |

    Pole `title` jest stałe dla danego `type` (np. `Malformed request`, `Request validation failed`).

    Kody w `errors[].code` dla `validation`: `required`, `invalid_format`, `out_of_range`,
    `invalid_phone_number`, `too_many_segments`, `unsupported_characters`, `unknown_channel`,
    `channel_disabled`, `no_matching_channel`, `expires_at_in_past`, `insecure_transport_not_allowed`,
    `scope_exceeds_role`, `unknown_user`, `unknown_device`.

    Każda operacja przyjmująca ciało żądania może zwrócić `413` (`payload-too-large`), gdy ciało
    przekracza limit rozmiaru serwera.

    ## Odpowiedzi wspólne dla wszystkich ścieżek
    Żądania, które nie trafiają do żadnej operacji kontraktu, dostają odpowiedź **przed** uwierzytelnieniem
    (bez nagłówków `RateLimit-*`):

    | Sytuacja | Odpowiedź |
    |---|---|
    | nieznana ścieżka pod `/api/v1` | `404` `not-found` (`components/responses/NotFound`) |
    | znana ścieżka, niedozwolona metoda | `405` `method-not-allowed` z nagłówkiem `Allow` (`components/responses/MethodNotAllowed`) |

    ## Paginacja
    Listy zwracają obiekt strony (`items`, `next_cursor`). Kolejną stronę pobiera się, przekazując
    `cursor=<next_cursor>` z tymi samymi filtrami. `next_cursor` równy `null` oznacza ostatnią stronę.
    Kursor jest nieprzezroczysty; nie należy go parsować. Wiadomości są sortowane od najnowszych (malejąco po `id`).

    ## Limity żądań
    Limit żądań jest liczony per token (SPEC §4.5) jako token bucket: pojemność `RateLimit-Limit` żądań,
    uzupełniana w całości w ciągu okna (domyślnie 120 żądań na 60 s). Żądanie z poprawnym tokenem zużywa
    jednostkę limitu jeszcze przed sprawdzeniem zakresu, więc także odpowiedzi `403`, `4xx` walidacji i `429`
    zawierają nagłówki `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`
    (wg draft-ietf-httpapi-ratelimit-headers, wariant z osobnymi polami).
    Nagłówków **nie ma** w odpowiedziach `401` (żądanie bez poprawnego tokenu niczego nie zużywa),
    w odpowiedziach wspólnych `404`/`405` dla nieznanych ścieżek i metod ani wtedy, gdy limit jest wyłączony
    w konfiguracji. Po wyczerpaniu limitu serwer zwraca `429` z nagłówkiem `Retry-After` (sekundy).
    Limit żądań API jest niezależny od limitu wysyłki kanału (`rate_per_min`), który nie powoduje `429`,
    tylko opóźnia wysyłkę z kolejki.

    ## Idempotencja
    `POST /messages` i `POST /messages/batch` przyjmują nagłówek `Idempotency-Key`
    (wg draft-ietf-httpapi-idempotency-key-header). Klucz jest unikalny w obrębie tokenu przez 24 h:
    - powtórzenie z tym samym kluczem i tym samym ciałem zwraca odpowiedź o tym samym statusie (`202`) i tej samej
      strukturze, z tymi samymi wiadomościami w **bieżącym** stanie (np. już `sent`), z nagłówkiem
      `Idempotent-Replayed: true`; nowa wiadomość nie powstaje. Powtórzenie jest rozpoznawane przed walidacją,
      więc zwraca pierwotne wiadomości nawet wtedy, gdy samo żądanie nie przeszłoby jej teraz
      (np. kanał wyłączono w międzyczasie);
    - ten sam klucz z innym ciałem daje `422` (`idempotency-key-mismatch`); dotyczy to także użycia klucza
      z `POST /messages` w `POST /messages/batch` i odwrotnie;
    - ten sam klucz, gdy pierwsze żądanie jest jeszcze przetwarzane, daje `409` (`idempotency-key-in-use`).
    Ciała porównywane są po kanonizacji JSON (kolejność pól nie ma znaczenia).
    Żądania zakończone błędem `4xx`/`5xx` nie rezerwują klucza.

    ## Wiadomości dzielone (`split`)
    Gdy serwer działa ze strategią długich wiadomości `split` (`TIKKER_LONG_MESSAGE_STRATEGY`, SPEC §4.6),
    jedno żądanie wysyłki może utworzyć **kilka niezależnych wiadomości** (każda z prefiksem `(i/N) `,
    wspólnym `client_ref` i własnym cyklem życia, SPEC §12 p. 3). Dlatego `POST /messages` zwraca obiekt
    `SendMessageResponse` z listą `messages` (zwykle jednoelementową), a `POST /messages/batch` – po jednym
    takim obiekcie na każdą pozycję paczki.
servers:
  - url: /api/v1
    description: Względem adresu instancji tikker (np. `https://sms.example.org/api/v1`).
tags:
  - name: messages
    description: Wysyłka, historia i anulowanie wiadomości SMS (wychodzących i przychodzących).
  - name: channels
    description: Kanały (urządzenie + port LTE) ze stanem zdrowia.
  - name: devices
    description: Urządzenia MikroTik RouterOS (tylko `admin`).
  - name: tokens
    description: Tokeny API (tylko `admin`).
  - name: users
    description: Użytkownicy panelu i właściciele tokenów (tylko `admin`).
  - name: webhooks
    description: Webhooki – powiadomienia HTTP o SMS-ach przychodzących i zmianie statusu wiadomości (tylko `admin`).
  - name: health
    description: Sondy żywotności i gotowości (bez autoryzacji, poza `/api/v1`).
security:
  - bearerAuth: []

paths:
  /messages:
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Wyślij SMS
      description: |
        Przyjmuje wiadomość do kolejki i zwraca `202` z obiektem `SendMessageResponse`: listą `messages`
        utworzonych wiadomości w stanie `queued`. Zwykle jest to jedna wiadomość; przy strategii `split`
        (sekcja „Wiadomości dzielone”) – kolejne części w kolejności treści. Nagłówek `Location` wskazuje
        pierwszą wiadomość.
        Numer `to` jest normalizowany do E.164 (region domyślny z konfiguracji, SPEC §4.6),
        kodowanie (`gsm7`/`ucs2`) i liczba segmentów są wyliczane przez serwer.
        Kanał wybiera routing (SPEC §4.4): `channel_id` → `tags` → wszystkie aktywne kanały.
        Pole `channel_id` w odpowiedzi jest `null`, dopóki dispatcher nie przydzieli kanału
        (chyba że podano go jawnie).
      security:
        - bearerAuth: ['sms:send']
      x-required-scopes: ['sms:send']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              polish:
                summary: SMS z polskimi znakami (UCS-2)
                value:
                  to: '+48600100200'
                  body: 'Twój kod weryfikacyjny: 482913. Ważny 5 minut.'
                  client_ref: 'otp-7f3a91'
                  expires_at: '2026-11-25T09:55:00Z'
              long:
                summary: Długi SMS GSM-7 (2 segmenty), wybór kanału po tagach
                value:
                  to: '600100201'
                  body: 'Dzien dobry, przypominamy o planowanym przegladzie instalacji w dniu 2026-11-25 w godzinach 8:00-12:00. Prosimy o zapewnienie dostepu do pomieszczenia technicznego. W razie pytan prosimy o kontakt pod numerem 22 123 45 67.'
                  tags: ['orange', 'bulk']
                  client_ref: 'crm-ticket-4411'
              explicitChannel:
                summary: Jawny kanał
                value:
                  to: '+48600100202'
                  body: 'Alarm: temperatura w serwerowni 31 C'
                  channel_id: '01M88ZA4DC268MPN2Z7ECB2KZ6'
      responses:
        '202':
          description: Przyjęto do kolejki (lub powtórzenie idempotentne – patrz `Idempotent-Replayed`).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
              examples:
                polish:
                  summary: Wiadomość UCS-2 w kolejce
                  value:
                    messages:
                      - id: '01M89304ZQ61F6CVNX486V10VC'
                        direction: out
                        channel_id: null
                        peer: '+48600100200'
                        body: 'Twój kod weryfikacyjny: 482913. Ważny 5 minut.'
                        encoding: ucs2
                        segments: 1
                        status: queued
                        attempts: 0
                        next_attempt_at: null
                        last_error: null
                        possible_duplicate: false
                        client_ref: 'otp-7f3a91'
                        tags: []
                        expires_at: '2026-11-25T09:55:00Z'
                        created_by: 'token:01M892MQA05HWZW8AF2ZXZHMH3'
                        created_at: '2026-11-25T09:46:40Z'
                        sent_at: null
                        received_at: null
                long:
                  summary: Długa wiadomość GSM-7 (2 segmenty) w kolejce
                  value:
                    messages:
                      - id: '01M891QES8WQZGV91A5WVKBCKF'
                        direction: out
                        channel_id: null
                        peer: '+48600100201'
                        body: 'Dzien dobry, przypominamy o planowanym przegladzie instalacji w dniu 2026-11-25 w godzinach 8:00-12:00. Prosimy o zapewnienie dostepu do pomieszczenia technicznego. W razie pytan prosimy o kontakt pod numerem 22 123 45 67.'
                        encoding: gsm7
                        segments: 2
                        status: queued
                        attempts: 0
                        next_attempt_at: null
                        last_error: null
                        possible_duplicate: false
                        client_ref: 'crm-ticket-4411'
                        tags: ['orange', 'bulk']
                        expires_at: null
                        created_by: 'token:01M892MQA05HWZW8AF2ZXZHMH3'
                        created_at: '2026-11-25T09:48:57Z'
                        sent_at: null
                        received_at: null
                split:
                  summary: Tekst podzielony na 2 wiadomości (strategia `split`)
                  value:
                    messages:
                      - id: '01M893A4V2N9Q6S7T8W9X0Y1Z2'
                        direction: out
                        channel_id: null
                        peer: '+48600100201'
                        body: '(1/2) Dzien dobry, przypominamy o planowanym przegladzie instalacji w dniu 2026-11-25 w godzinach 8:00-12:00. Prosimy o zapewnienie dostepu do pomieszczenia'
                        encoding: gsm7
                        segments: 1
                        status: queued
                        attempts: 0
                        next_attempt_at: null
                        last_error: null
                        possible_duplicate: false
                        client_ref: 'crm-ticket-4411'
                        tags: []
                        expires_at: null
                        created_by: 'token:01M892MQA05HWZW8AF2ZXZHMH3'
                        created_at: '2026-11-25T09:48:57Z'
                        sent_at: null
                        received_at: null
                      - id: '01M893A4V2N9Q6S7T8W9X0Y1Z3'
                        direction: out
                        channel_id: null
                        peer: '+48600100201'
                        body: '(2/2) technicznego. W razie pytan prosimy o kontakt pod numerem 22 123 45 67.'
                        encoding: gsm7
                        segments: 1
                        status: queued
                        attempts: 0
                        next_attempt_at: null
                        last_error: null
                        possible_duplicate: false
                        client_ref: 'crm-ticket-4411'
                        tags: []
                        expires_at: null
                        created_by: 'token:01M892MQA05HWZW8AF2ZXZHMH3'
                        created_at: '2026-11-25T09:48:57Z'
                        sent_at: null
                        received_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/MessageUnprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [messages]
      operationId: listMessages
      summary: Lista wiadomości
      description: |
        Zwraca wiadomości wychodzące i przychodzące, od najnowszych. Filtry łączone są koniunkcją,
        a powtórzony parametr `status` daje alternatywę (`status=queued&status=sending`).
        `since` (włącznie) i `until` (wyłącznie) dotyczą `created_at`.
      security:
        - bearerAuth: ['sms:read']
      x-required-scopes: ['sms:read']
      parameters:
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/Direction'
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageStatus'
            uniqueItems: true
          example: [queued, sending]
        - name: peer
          in: query
          description: Numer rozmówcy; normalizowany jak `to` w `SendMessageRequest`, porównanie dokładne.
          schema:
            type: string
            maxLength: 32
          example: '+48600100200'
        - name: channel_id
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: since
          in: query
          description: '`created_at >= since` (RFC 3339).'
          schema:
            type: string
            format: date-time
          example: '2026-11-25T00:00:00Z'
        - name: until
          in: query
          description: '`created_at < until` (RFC 3339).'
          schema:
            type: string
            format: date-time
          example: '2026-11-26T00:00:00Z'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Strona wiadomości.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
              examples:
                mixed:
                  summary: Wychodząca wysłana i przychodząca
                  value:
                    items:
                      - id: '01M8924050XWV0PQGR9F58E24E'
                        direction: in
                        channel_id: '01M88ZA4DC268MPN2Z7ECB2KZ6'
                        peer: '+48600100200'
                        body: 'Potwierdzam wizytę, dziękuję.'
                        encoding: ucs2
                        segments: 1
                        status: received
                        attempts: 0
                        next_attempt_at: null
                        last_error: null
                        possible_duplicate: false
                        client_ref: null
                        tags: []
                        expires_at: null
                        created_by: null
                        created_at: '2026-11-25T09:55:48Z'
                        sent_at: null
                        received_at: '2026-11-25T09:55:31Z'
                      - id: '01M89316X8MQM8Y3TW4S14MKFP'
                        direction: out
                        channel_id: '01M88ZA4DC268MPN2Z7ECB2KZ6'
                        peer: '+48600100201'
                        body: 'Dzień dobry! Przypominamy o wizycie jutro o 10:00. Prosimy zabrać dowód osobisty.'
                        encoding: ucs2
                        segments: 2
                        status: sent
                        attempts: 1
                        next_attempt_at: null
                        last_error: null
                        possible_duplicate: false
                        client_ref: null
                        tags: []
                        expires_at: null
                        created_by: 'user:01M892RX38GF5SDDMYJSPTB8E4'
                        created_at: '2026-11-25T09:48:57Z'
                        sent_at: '2026-11-25T09:49:03Z'
                        received_at: null
                    next_cursor: 'eyJpZCI6IjAxTTg5MVFFUzhXUVpHVjkxQTVXVktCQ0tGIn0'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/batch:
    post:
      tags: [messages]
      operationId: sendMessageBatch
      summary: Wyślij paczkę SMS (do 100)
      description: |
        Przyjmuje od 1 do 100 wiadomości **atomowo**: albo wszystkie trafiają do kolejki, albo żadna.
        Błędy walidacji wskazują pozycję przez wskaźnik JSON w `errors[].field` (np. `/messages/3/to`).
        Więcej niż 100 pozycji daje `413` (`batch-too-large`). `Idempotency-Key` dotyczy całej paczki.
        Odpowiedź zawiera po jednej pozycji `items[i]` na każdą pozycję `messages[i]` żądania (ta sama kolejność
        i liczba); `items[i]` ma postać odpowiedzi `POST /messages` dla tej pozycji (lista `messages`,
        kilka elementów przy strategii `split`).
      security:
        - bearerAuth: ['sms:send']
      x-required-scopes: ['sms:send']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBatchRequest'
            examples:
              twoMessages:
                summary: Dwie wiadomości
                value:
                  messages:
                    - to: '+48600100200'
                      body: 'Twój kod weryfikacyjny: 482913. Ważny 5 minut.'
                      client_ref: 'otp-7f3a91'
                      expires_at: '2026-11-25T09:55:00Z'
                    - to: '600100201'
                      body: 'Dzien dobry, przypominamy o planowanym przegladzie instalacji w dniu 2026-11-25 w godzinach 8:00-12:00. Prosimy o zapewnienie dostepu do pomieszczenia technicznego. W razie pytan prosimy o kontakt pod numerem 22 123 45 67.'
                      tags: ['orange', 'bulk']
                      client_ref: 'crm-ticket-4411'
      responses:
        '202':
          description: Wszystkie wiadomości przyjęto do kolejki.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendBatchResponse'
              examples:
                twoMessages:
                  summary: Dwie wiadomości w kolejce
                  value:
                    items:
                      - messages:
                          - id: '01M89304ZQ61F6CVNX486V10VC'
                            direction: out
                            channel_id: null
                            peer: '+48600100200'
                            body: 'Twój kod weryfikacyjny: 482913. Ważny 5 minut.'
                            encoding: ucs2
                            segments: 1
                            status: queued
                            attempts: 0
                            next_attempt_at: null
