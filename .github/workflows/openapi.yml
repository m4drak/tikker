name: openapi

on:
  pull_request:
    paths:
      - 'api/**'
      - 'redocly.yaml'
      - '.redocly.lint-ignore.yaml'
      - '.github/workflows/openapi.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'redocly.yaml'
      - '.redocly.lint-ignore.yaml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint
