# golangci-lint v2 configuration.
# Docs: https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m
  go: "1.24"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - misspell
  settings:
    misspell:
      # "routeros" is a package name (internal/connector/routeros), not a typo.
      ignore-rules:
        - routeros

formatters:
  enable:
    - gofmt
    - goimports
